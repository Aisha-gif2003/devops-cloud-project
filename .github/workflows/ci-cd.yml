name: Build, Push to ACR, and Deploy to AKS

on:
  push:
    branches: [ main, master ]

env:
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ secrets.ACR_NAME }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build Docker Image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          docker build -t "$ACR_LOGIN_SERVER/devops-cloud-project:${{ github.sha }}" .

      - name: Push Docker Image to ACR
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          docker push "$ACR_LOGIN_SERVER/devops-cloud-project:${{ github.sha }}"

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing

      - name: Deploy to AKS
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          sed -e "s|__ACR_LOGIN_SERVER__|$ACR_LOGIN_SERVER|g" -e "s|__IMAGE_TAG__|${{ github.sha }}|g" node-app.yaml | kubectl apply -f -
          kubectl apply -f my-ingress.yaml
