# The router: whichever "version" this selector points at receives ALL traffic.
# Blue-green switch = patching the selector between blue and green (see switch scripts).
apiVersion: v1
kind: Service
metadata:
  name: nodejs-bg-service
spec:
  type: NodePort
  selector:
    app: nodejs-app
    version: blue        # <-- live environment; flipped by switch.ps1 / switch.sh
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
